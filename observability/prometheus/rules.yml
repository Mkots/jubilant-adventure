groups:
    - name: jubilant-adventure-api
      rules:
          - alert: ApiHighErrorRatio
            expr: |
                sum(rate(http_request_errors_total{status_class="5xx"}[2m]))
                /
                clamp_min(sum(rate(http_requests_total[2m])), 1) > 0.05
            for: 2m
            labels:
                severity: warning
            annotations:
                summary: API 5xx ratio is above 5 percent
                description: The API has sustained server errors for two minutes.
          - alert: ApiHighP95Latency
            expr: |
                histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[2m]))) > 1
            for: 2m
            labels:
                severity: warning
            annotations:
                summary: API p95 latency is above one second
                description: The API has sustained high request latency.
