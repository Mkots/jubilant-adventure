name: ZAP active

on:
    workflow_dispatch:
    schedule:
        - cron: '45 2 * * 1'

permissions:
    contents: read

concurrency:
    group: zap-active
    cancel-in-progress: true

jobs:
    active:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Check out
              uses: actions/checkout@v5
            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Start disposable API
              id: environment
              run: npm run env:test:up
            - name: Run ZAP active scan
              if: steps.environment.outcome == 'success'
              run: npm run test:security:zap:active
            - name: Capture ZAP environment diagnostics
              if: always()
              run: |
                  mkdir -p artifacts/security/zap
                  docker compose --profile performance ps > artifacts/security/zap/compose-ps.txt || true
                  docker compose --profile performance logs --no-color > artifacts/security/zap/compose.log || true
            - name: Stop disposable API
              if: always()
              run: npm run env:test:down
            - name: Upload ZAP active reports
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: zap-active-${{ github.run_id }}
                  path: artifacts/security/zap
                  if-no-files-found: warn
                  retention-days: 14
