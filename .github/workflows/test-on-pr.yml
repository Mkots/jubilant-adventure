name: CI Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test & Lint
        permissions:
            contents: read
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install Chromium for Storybook tests
              run: npx playwright install --with-deps chromium

            - name: Run CI
              run: npm run ci

            - name: Run Storybook interaction and accessibility tests
              run: npm run test:storybook --workspace apps/web

            - name: Run visual regression tests
              run: npm run test:visual

            - name: Upload visual regression artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-regression-artifacts
                  path: |
                      tests/visual/test-results/
                      tests/visual/playwright-report/
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Export OpenAPI contract
              run: npm run export:openapi --workspace apps/api

            - name: Upload OpenAPI contract
              uses: actions/upload-artifact@v4
              with:
                  name: openapi-contract
                  path: apps/api/openapi.json
                  retention-days: 7

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: true

            - name: Upload test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  report_type: test_results
                  fail_ci_if_error: true

    security:
        name: Security Audit
        permissions:
            contents: read
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run security audit
              run: npm audit --audit-level=moderate

    api-schemathesis:
        name: API & Schemathesis
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Install dependencies
              run: |
                  npm ci
                  python -m venv .venv
                  .venv/bin/python -m pip install --upgrade pip
                  .venv/bin/pip install schemathesis

            - name: Run black-box API scenarios
              run: npm run test:api

            - name: Start test API
              run: |
                  mkdir -p artifacts
                  APP_MODE=test TEST_CONTROL_KEY=ci-test-control API_TOKEN_SECRET=ci-secret PORT=3412 npm start > artifacts/api.log 2>&1 &
                  echo $! > artifacts/api.pid

            - name: Wait for API readiness
              run: |
                  for attempt in $(seq 1 60); do
                      if curl --fail --silent http://127.0.0.1:3412/openapi.json > /dev/null; then
                          exit 0
                      fi
                      sleep 1
                  done
                  cat artifacts/api.log
                  exit 1

            - name: Export live OpenAPI contract
              run: curl --fail --silent http://127.0.0.1:3412/openapi.json --output artifacts/openapi.json

            - name: Create Schemathesis auth context
              run: |
                  token=$(curl --fail --silent --request POST http://127.0.0.1:3412/auth/login \
                      --header 'Content-Type: application/json' \
                      --data '{"email":"admin@example.test","password":"password"}' \
                      | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(data).token));")
                  echo "SCHEMATHESIS_AUTH_TOKEN=$token" >> "$GITHUB_ENV"

            - name: Run Schemathesis
              env:
                  SCHEMATHESIS_SPEC: artifacts/openapi.json
                  SCHEMATHESIS_BASE_URL: http://127.0.0.1:3412
              run: npm run test:schemathesis

            - name: Stop test API
              if: always()
              run: |
                  if test -f artifacts/api.pid; then
                      kill "$(cat artifacts/api.pid)" 2>/dev/null || true
                  fi

            - name: Upload API test artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: api-schemathesis-results
                  path: artifacts/
                  if-no-files-found: warn
                  retention-days: 7
