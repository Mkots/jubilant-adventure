name: CI Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
    test:
        name: Test & Lint
        permissions:
            contents: read
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Install Chromium for Storybook tests
              run: ./node_modules/.bin/playwright install --with-deps chromium

            - name: Run CI
              run: npm run ci

            - name: Run Storybook interaction and accessibility tests
              run: npm run test:storybook --workspace apps/web

            - name: Run visual regression tests
              run: npm run test:visual

            - name: Upload visual regression artifacts
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: visual-regression-artifacts
                  path: |
                      tests/visual/test-results/
                      tests/visual/playwright-report/
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Export OpenAPI contract
              run: npm run export:openapi --workspace apps/api

            - name: Upload OpenAPI contract
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: openapi-contract
                  path: apps/api/openapi.json
                  retention-days: 7

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: true

            - name: Upload test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  report_type: test_results
                  fail_ci_if_error: true

    security:
        name: Security Audit
        permissions:
            contents: read
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run security audit
              run: npm audit --audit-level=moderate

    api-schemathesis:
        name: API & Schemathesis
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Setup Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.12'

            - name: Install dependencies
              run: |
                  npm ci --ignore-scripts
                  python -m venv .venv
                  .venv/bin/python -m pip install --upgrade pip
                  .venv/bin/pip install schemathesis

            - name: Run black-box API scenarios
              run: npm run test:api

            - name: Start test API
              run: |
                  mkdir -p artifacts
                  APP_MODE=test TEST_CONTROL_KEY=ci-test-control API_TOKEN_SECRET=ci-secret PORT=3412 npm start > artifacts/api.log 2>&1 &
                  echo $! > artifacts/api.pid

            - name: Wait for API readiness
              run: |
                  for attempt in $(seq 1 60); do
                      if curl --fail --silent http://127.0.0.1:3412/openapi.json > /dev/null; then
                          exit 0
                      fi
                      sleep 1
                  done
                  cat artifacts/api.log
                  exit 1

            - name: Export live OpenAPI contract
              run: curl --fail --silent http://127.0.0.1:3412/openapi.json --output artifacts/openapi.json

            - name: Create Schemathesis auth context
              run: |
                  auth_response=artifacts/auth-response.json
                  curl --fail --silent --request POST http://127.0.0.1:3412/auth/login \
                      --header 'Content-Type: application/json' \
                      --data '{"email":"admin@example.test","password":"password"}' \
                      --output "$auth_response"
                  token=$(jq --exit-status --raw-output '.token | select(type == "string" and length > 0)' "$auth_response")
                  echo "SCHEMATHESIS_AUTH_TOKEN=$token" >> "$GITHUB_ENV"

            - name: Run Schemathesis
              env:
                  SCHEMATHESIS_SPEC: artifacts/openapi.json
                  SCHEMATHESIS_BASE_URL: http://127.0.0.1:3412
              run: npm run test:schemathesis

            - name: Stop test API
              if: always()
              run: |
                  if test -f artifacts/api.pid; then
                      kill "$(cat artifacts/api.pid)" 2>/dev/null || true
                  fi

            - name: Upload API test artifacts
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: api-schemathesis-results
                  path: artifacts/
                  if-no-files-found: warn
                  retention-days: 7

    integration-db:
        name: PostgreSQL Integration
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run PostgreSQL integration tests
              run: |
                  mkdir -p artifacts
                  npm run test:integration:db -- --reporter=verbose

            - name: Capture Docker state
              if: always()
              run: |
                  docker ps -a > artifacts/docker-ps.txt
                  docker info > artifacts/docker-info.txt

            - name: Upload PostgreSQL diagnostics
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: postgres-integration-diagnostics
                  path: artifacts/
                  if-no-files-found: warn
                  retention-days: 7

    wiremock-contract:
        name: WireMock Payment Contract
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Start WireMock
              run: npm run wiremock:up

            - name: Run WireMock and payment contract tests
              run: |
                  mkdir -p artifacts
                  npm run test:wiremock -- --reporter=verbose
                  npm run test:payment-contract -- --reporter=verbose

            - name: Capture WireMock diagnostics
              if: always()
              run: |
                  mkdir -p artifacts
                  docker compose --profile testing ps > artifacts/wiremock-ps.txt
                  docker compose --profile testing logs --no-color wiremock > artifacts/wiremock.log

            - name: Stop WireMock
              if: always()
              run: npm run wiremock:down

            - name: Upload WireMock diagnostics
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: wiremock-contract-diagnostics
                  path: artifacts/
                  if-no-files-found: warn
                  retention-days: 7

    pact-consumer:
        name: Pact Consumer Contract
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Generate consumer Pact
              run: npm run test:pact:consumer -- --reporter=verbose

            - name: Create Pact checksums
              run: sha256sum pacts/*.json > pacts/SHA256SUMS

            - name: Upload generated Pact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: pact-consumer-contract
                  path: pacts/
                  if-no-files-found: error
                  retention-days: 7

    pact-provider:
        name: Pact Provider Verification
        needs: pact-consumer
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Download consumer Pact
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
              with:
                  name: pact-consumer-contract
                  path: pacts

            - name: Verify downloaded Pact checksums
              run: sha256sum --check pacts/SHA256SUMS

            - name: Verify provider against consumer Pact
              run: npm run test:pact:provider -- --reporter=verbose
