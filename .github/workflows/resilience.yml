name: Payment Resilience

on:
    workflow_dispatch:
    schedule:
        - cron: '15 3 * * 1'

permissions:
    contents: read

concurrency:
    group: resilience-${{ github.workflow }}
    cancel-in-progress: true

env:
    POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
    payment-timeout:
        name: Toxiproxy payment timeout
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Start resilience environment
              run: timeout 8m npm run env:resilience:up

            - name: Run payment timeout scenario
              env:
                  RESILIENCE_REQUIRED: '1'
              run: timeout 5m npm run test:resilience:payment-timeout

            - name: Capture sanitized diagnostics
              if: always()
              run: |
                  mkdir -p artifacts/resilience
                  docker compose --profile resilience ps > artifacts/resilience/compose-ps.txt || true
                  docker compose --profile resilience logs --no-color resilience-api toxiproxy wiremock > artifacts/resilience/services.log || true

            - name: Stop resilience environment
              if: always()
              run: npm run env:resilience:down

            - name: Upload resilience diagnostics
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: resilience-${{ github.run_id }}
                  path: artifacts/resilience/
                  if-no-files-found: ignore
                  retention-days: 14
