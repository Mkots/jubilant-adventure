name: Test Reports

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: test-reports-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    report:
        name: Generate sanitized test reports
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout code
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Setup Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Install Chromium
              run: npx playwright@1.63.0 install --with-deps chromium

            - name: Run API and E2E suites with Allure
              id: suites
              continue-on-error: true
              run: npm run test:allure

            - name: Check published report
              if: ${{ !cancelled() }}
              run: npm run check:published-report

            - name: Write Job Summary
              if: ${{ !cancelled() }}
              env:
                  ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync("artifacts/allure/summary.json")); const failures=s.failed+s.broken; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Test report\n\n| Total | Passed | Failed/broken | Skipped | Duration |\n| ---: | ---: | ---: | ---: | ---: |\n| ${s.total} | ${s.passed} | ${failures} | ${s.skipped} | ${s.durationMs} ms |\n\nArtifacts: [run artifacts](${process.env.ARTIFACT_URL})\n`);'

            - name: Upload sanitized Allure results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: allure-results
                  path: artifacts/allure/results
                  if-no-files-found: warn
                  retention-days: 14

            - name: Upload static Allure report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: allure-report
                  path: artifacts/allure/report
                  if-no-files-found: warn
                  retention-days: 14

            - name: Upload browser diagnostics
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: browser-diagnostics
                  path: |
                      tests/e2e/playwright-report
                      tests/e2e/test-results
                  if-no-files-found: warn
                  retention-days: 14

            - name: Fail when suites failed
              if: ${{ steps.suites.outcome == 'failure' }}
              run: exit 1

    deploy-pages:
        name: Deploy latest main report
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        needs: report
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Download static Allure report
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
              with:
                  name: allure-report
                  path: artifacts/allure/report

            - name: Configure Pages
              uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
              with:
                  path: artifacts/allure/report

            - name: Deploy to Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
