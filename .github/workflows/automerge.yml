name: Auto-merge Dependabot PRs

permissions:
    contents: write
    pull-requests: write

on:
    pull_request:
        types: [opened, synchronize, reopened]
        branches: [main]

jobs:
    auto-merge:
        runs-on: ubuntu-latest
        if: github.actor == 'dependabot[bot]'

        steps:
            - name: Enable auto-merge
              run: gh pr merge --repo "${{ github.repository }}" --auto --squash "${{ github.event.pull_request.number }}"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
