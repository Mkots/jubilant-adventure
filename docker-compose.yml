services:
    postgres:
        image: postgres:16.4-alpine
        profiles: [db, integration, performance, resilience]
        environment:
            POSTGRES_DB: jubilant_adventure
            POSTGRES_USER: jubilant
            POSTGRES_PASSWORD: local-only
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - jubilant-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U jubilant -d jubilant_adventure']
            interval: 2s
            timeout: 3s
            retries: 20
    api:
        build:
            context: .
            dockerfile: docker/api-test.Dockerfile
        image: jubilant-adventure/api-test:local
        profiles: [performance]
        environment:
            APP_MODE: test
            APP_PERSISTENCE: postgres
            DATABASE_URL: postgres://jubilant:local-only@postgres:5432/jubilant_adventure
            TEST_CONTROL_KEY: performance-control
            API_TOKEN_SECRET: performance-secret
            PORT: 3412
        depends_on:
            postgres:
                condition: service_healthy
        ports:
            - '${API_PORT:-3412}:3412'
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3412/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 2s
            timeout: 3s
            retries: 30
    resilience-api:
        build:
            context: .
            dockerfile: docker/api-test.Dockerfile
        image: jubilant-adventure/api-test:local
        profiles: [resilience]
        environment:
            APP_MODE: test
            APP_PERSISTENCE: postgres
            DATABASE_URL: postgres://jubilant:local-only@postgres:5432/jubilant_adventure
            PAYMENT_GATEWAY_URL: http://toxiproxy:8666
            PAYMENT_TIMEOUT_MS: 200
            TEST_CONTROL_KEY: resilience-control
            API_TOKEN_SECRET: resilience-secret
            PORT: 3412
        depends_on:
            postgres:
                condition: service_healthy
            wiremock:
                condition: service_healthy
            toxiproxy:
                condition: service_started
        ports:
            - '${RESILIENCE_API_PORT:-3413}:3412'
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3412/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 2s
            timeout: 3s
            retries: 30
    wiremock:
        image: wiremock/wiremock:3.9.2
        profiles: [testing, resilience]
        command: ['--global-response-templating', '--verbose']
        ports:
            - '${WIREMOCK_PORT:-8080}:8080'
        volumes:
            - ./tests/wiremock/payment:/home/wiremock
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q -O - http://127.0.0.1:8080/__admin/health >/dev/null',
                ]
            interval: 2s
            timeout: 3s
            retries: 20
    toxiproxy:
        image: ghcr.io/shopify/toxiproxy:2.12.0
        profiles: [resilience]
        ports:
            - '${TOXIPROXY_PAYMENT_PORT:-8666}:8666'
            - '${TOXIPROXY_API_PORT:-8474}:8474'
volumes:
    jubilant-postgres-data:
